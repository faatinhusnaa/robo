info:
  name: Find user by ID
  type: http
  seq: 4
  tags:
    - users

http:
  method: GET
  url: "{{baseUrl}}/users/:id"
  params:
    - name: id
      value: ""
      type: path
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
