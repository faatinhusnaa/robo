info:
  name: Login and get JWT token
  type: http
  seq: 1
  tags:
    - auth

http:
  method: POST
  url: "{{baseUrl}}/auth/login"
  body:
    type: json
    data: "{}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() === 200) {
          const data = res.getBody();
          bru.setEnvVar("token", data.access_token);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: JWT token returned successfully
    request:
      url: "{{baseUrl}}/auth/login"
      method: POST
      body:
        type: json
        data: "{}"
    response:
      status: 200
      statusText: OK
      body:
        type: text
        data: ""
  - name: 400 Response
    description: Missing credentials
    request:
      url: "{{baseUrl}}/auth/login"
      method: POST
      body:
        type: json
        data: "{}"
    response:
      status: 400
      statusText: Bad Request
      body:
        type: text
        data: ""
  - name: 401 Response
    description: Invalid credentials
    request:
      url: "{{baseUrl}}/auth/login"
      method: POST
      body:
        type: json
        data: "{}"
    response:
      status: 401
      statusText: Unauthorized
      body:
        type: text
        data: ""
  - name: 429 Response
    description: Too Many Requests
    request:
      url: "{{baseUrl}}/auth/login"
      method: POST
      body:
        type: json
        data: "{}"
    response:
      status: 429
      statusText: Too Many Requests
      body:
        type: text
        data: ""
